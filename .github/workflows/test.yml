name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: Playwright 1.56 has no Chromium for Ubuntu 26.04, which ubuntu-latest became in Oct 2026
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Memory maps and WASM cores match their sources
        run: npm run check
      - name: Unit and browser tests
        run: npm test
